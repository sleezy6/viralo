name: Publish images

# Builds every Viralo image and pushes it to GitHub Container Registry, so a
# NAS can pull ready-made images (deploy/docker-compose.yml) instead of
# building from source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: core,     context: .,             dockerfile: services/core/Dockerfile,     target: production }
          - { name: video,    context: .,             dockerfile: services/video/Dockerfile,    target: production }
          - { name: agent,    context: .,             dockerfile: services/agent/Dockerfile,    target: production }
          - { name: workflow, context: .,             dockerfile: services/workflow/Dockerfile, target: production }
          - { name: platform, context: .,             dockerfile: services/platform/Dockerfile, target: production }
          - { name: frontend, context: frontend,      dockerfile: frontend/Dockerfile,          target: production }
          - { name: gateway,  context: docker/gateway, dockerfile: docker/gateway/Dockerfile,   target: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (video image is large)
        if: matrix.name == 'video'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Image name
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/viralo-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          # Same-origin API paths; the gateway routes them to each service.
          build-args: |
            VITE_API_BASE=/api/v1
            VITE_VIDEO_BASE=/api/v1/video
            VITE_AGENT_BASE=/api/v1/agent
            VITE_PLATFORM_BASE=/api/v1/platform
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
