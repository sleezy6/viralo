# Viralo for a NAS (UGREEN, Synology, Portainer...) — pulls prebuilt images,
# nothing is built on the NAS. Images come from .github/workflows/publish-images.yml
# in github.com/sleezy6/viralo (fork of sammyview80/viralo, Apache-2.0).
#
# Required variables (Docker app's environment section, or a .env next to this file):
#   POSTGRES_PASSWORD, RABBITMQ_PASS, SECRET_KEY, ENCRYPTION_KEY, ADMIN_JWT_SECRET, WEBSUB_SECRET
#
# AI — pick one or both:
#   Self-hosted (e.g. Unsloth `unsloth run`): LOCAL_LLM_BASE_URL (http://<pc-ip>:<port>),
#     LOCAL_LLM_API_KEY, LOCAL_LLM_MODEL (an id from /v1/models). Optional local
#     speech-to-text: LOCAL_STT_BASE_URL, LOCAL_STT_MODEL (+ LOCAL_STT_API_KEY,
#     LOCAL_STT_LANGUAGE for models that do not detect language, default en).
#   Hosted free tiers: GROQ_API_KEY (also does transcription), OPENROUTER_API_KEY, ...
#
# Optional: FRONTEND_URL (e.g. http://192.168.1.50:3000), VIRALO_PORT (default 3000).
# Open http://<nas-ip>:3000 when it's up. YouTube cookies are intentionally off.
name: viralo
services:
  postgres:
    networks:
    - viralo-internal
    restart: unless-stopped
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: viralo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: viralo
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
  redis:
    networks:
    - viralo-internal
    restart: unless-stopped
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    image: redis:7-alpine
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
    - redis-data:/data
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      test:
      - CMD
      - redis-cli
      - ping
  rabbitmq:
    networks:
    - viralo-internal
    restart: unless-stopped
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    image: rabbitmq:3-management-alpine
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      RABBITMQ_DEFAULT_USER: viralo
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?set RABBITMQ_PASS}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit consumer_timeout 10800000
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
      test:
      - CMD
      - rabbitmq-diagnostics
      - ping
  frontend:
    image: ghcr.io/sleezy6/viralo-frontend:latest
    networks:
    - viralo-internal
    restart: unless-stopped
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1
    environment:
      DATABASE_URL: postgresql+asyncpg://viralo:${POSTGRES_PASSWORD}@postgres:5432/viralo
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://viralo:${RABBITMQ_PASS}@rabbitmq:5672//
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?set ADMIN_JWT_SECRET}
      WEBSUB_SECRET: ${WEBSUB_SECRET:?set WEBSUB_SECRET}
      SELF_HOSTED: 'true'
      ENVIRONMENT: development
      DEBUG: 'false'
      APP_DOMAIN: localhost
      ACCESS_TOKEN_EXPIRE_MINUTES: '15'
      REFRESH_TOKEN_EXPIRE_DAYS: '30'
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      SAMBANOVA_API_KEY: ${SAMBANOVA_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      LOCAL_STT_BASE_URL: ${LOCAL_STT_BASE_URL:-}
      LOCAL_STT_API_KEY: ${LOCAL_STT_API_KEY:-}
