# Viralo gateway: one entry point for the web app and every API service.
# The frontend calls relative paths (/api/v1/...), so they must be served
# from the same origin as the UI. Longest-prefix matching picks the service.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Video uploads can be large; long renders can hold requests open.
    client_max_body_size 10g;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
    # Stream responses straight to the browser instead of spooling them to temp files.
    # With buffering, a large video that outgrows nginx's memory buffers is written to
    # disk; if that temp folder isn't writable the download is cut off mid-file
    # (black editor preview, "Error in input stream"). Streaming also makes seeking
    # in videos faster and keeps live progress updates flowing.
    proxy_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Docker's internal DNS, so nginx starts even if a service is still booting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/v1/video/    { set $u http://video-service:8003;    proxy_pass $u; }
    location /api/v1/agent/    { set $u http://agent-service:8004;    proxy_pass $u; }
    location /api/v1/platform/ { set $u http://platform-service:8006; proxy_pass $u; }
    location /api/v1/          { set $u http://core-service:8001;     proxy_pass $u; }
    location /storage/         { set $u http://video-service:8003;    proxy_pass $u; }
    location /ws/              { set $u http://agent-service:8004;    proxy_pass $u; }

    location / {
        set $u http://frontend:3000;
        # Vite's preview server only accepts known host names.
        proxy_set_header Host localhost;
        proxy_pass $u;
    }
}
